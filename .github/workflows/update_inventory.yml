name: Update Inventory Data

on:
  schedule:
    # 毎平日 17:00〜21:00 JST (08:00〜12:00 UTC) の間、15分おきに自動実行
    - cron: '*/15 8-12 * * 1-5'
  workflow_dispatch: # GitHub画面から手動実行可能

jobs:
  update-inventory:
    runs-on: ubuntu-latest
    concurrency:
      group: "inventory-update"
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium
          playwright install-deps
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Generate latest inventory JSON
        run: |
          python scripts/fetch_inventory.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add inventory_latest.json app/src/main/assets/inventory_latest.json
          git commit -m "Auto-update general margin stock inventory [skip ci]" || echo "No changes to commit"
          git push
